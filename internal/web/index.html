<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc-memory-view</title>
<style>
  :root {
    --bg: #f0eee6;
    --surface: #ffffff;
    --surface-2: #faf9f5;
    --ink: #1a1915;
    --muted: #6b6a63;
    --faint: #737166;
    --border: #e4e1d6;
    --border-strong: #d5d1c4;
    --accent: #b04e2e;
    --accent-hover: #973f22;
    --accent-soft: #f6ece6;
    --header-bg: rgba(240,238,230,0.85);
    --focus-ring: rgba(176,78,46,0.30);
    --warn: #8a5a00;
    --warn-soft: #f7ecd0;
    --code-bg: #1a1915;
    --code-ink: #f0eee6;
    --serif: "Times New Roman", "Georgia", "Iowan Old Style", serif;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", "Fira Code", "JetBrains Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1815;
      --surface: #242219;
      --surface-2: #2b2820;
      --ink: #ece8dd;
      --muted: #a29e91;
      --faint: #837f74;
      --border: #35322a;
      --border-strong: #464236;
      --accent: #d4744f;
      --accent-hover: #e59470;
      --accent-soft: #3a281f;
      --header-bg: rgba(26,24,21,0.85);
      --focus-ring: rgba(212,116,79,0.40);
      --warn: #e0b35a;
      --warn-soft: #3b2e12;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); font-size: 16px; background: var(--bg); color: var(--ink); line-height: 1.7; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-hover); text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: baseline; gap: 12px;
    padding: 16px 28px;
    background: var(--header-bg);
    backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--border);
  }
  header .mark { flex: none; align-self: center; width: 15px; height: 15px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  header h1 { font-family: var(--serif); font-size: 1.4rem; font-weight: 600; letter-spacing: -0.01em; }
  header h1 a { color: inherit; }
  header h1 a:hover { text-decoration: none; }
  header .sub { font-size: 0.85rem; color: var(--muted); }

  body { height: 100vh; display: flex; flex-direction: column; }
  header { flex: none; }
  .panes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(360px, 2fr) 3fr; }
  #listPane { overflow: auto; padding: 24px 20px 40px 28px; border-right: 1px solid var(--border); }
  #detailPane { overflow: auto; padding: 32px 40px 60px; }
  #detailPane > * { max-width: 860px; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  input[type=search], select {
    padding: 10px 14px;
    border: 1px solid var(--border-strong); border-radius: 10px;
    background: var(--surface); color: var(--ink);
    font: 0.95rem var(--sans);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type=search] { flex: 1 1 240px; min-width: 0; }
  select { max-width: 100%; }
  input[type=search]::placeholder { color: var(--faint); }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }
  label.check { display: inline-flex; align-items: center; gap: 6px; font-size: 0.95rem; color: var(--muted); cursor: pointer; }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  .count { font-size: 0.88rem; color: var(--muted); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
  .label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

  .audit { padding: 20px 24px; }
  .audit-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 12px; }
  .audit-note { font-size: 0.88rem; color: var(--faint); overflow-wrap: anywhere; }
  .audit-note code { font-family: var(--mono); font-size: 0.85em; }
  header .btn.primary { margin-left: auto; align-self: center; }
  #launchBar { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 28px; background: var(--surface); border-bottom: 1px solid var(--border); }
  #launchBar[hidden] { display: none; }
  #launchBar .launch-result { flex: 1; }
  .dismiss { flex: none; border: 0; background: none; color: var(--muted); font-size: 1.2rem; line-height: 1; cursor: pointer; padding: 2px 6px; }
  .dismiss:hover { color: var(--accent); }
  .btn.primary { padding: 9px 16px; background: var(--accent); border-color: var(--accent); color: #fff; font-size: 0.95rem; font-weight: 600; }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .launch-result { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 0.92rem; color: var(--muted); }
  .launch-result code { font-family: var(--mono); font-size: 0.88rem; color: var(--ink); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; }
  .launch-result.error { color: var(--warn); }
  .stats { display: flex; flex-wrap: wrap; gap: 10px 32px; }
  .stat { display: flex; flex-direction: column; }
  .stat-num { font-family: var(--mono); font-size: 1.4rem; font-weight: 600; }
  .stat-num.warn { color: var(--warn); }
  .kinds { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }

  .list { overflow: hidden; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 20px; padding: 16px 22px; border-bottom: 1px solid var(--border); color: inherit; transition: background 0.12s; }
  .row:last-child { border-bottom: none; }
  .row:hover, .row.selected { background: var(--accent-soft); color: inherit; text-decoration: none; }
  .row.selected { box-shadow: inset 3px 0 0 var(--accent); }
  .row-name { font-weight: 600; font-size: 1.02rem; }
  .row-desc { grid-column: 1; color: var(--muted); font-size: 0.95rem; }
  .row-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--faint); overflow-wrap: anywhere; min-width: 0; }
  .ts { color: var(--faint); font-size: 0.85rem; white-space: nowrap; }
  .empty { padding: 48px; text-align: center; color: var(--faint); font-style: italic; }

  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); font: 0.78rem var(--mono); white-space: nowrap; }
  .badge.type { background: var(--code-bg); border-color: var(--code-bg); color: var(--code-ink); }
  .badge.issue { background: var(--warn-soft); border-color: transparent; color: var(--warn); }

  .back { display: none; margin-bottom: 20px; font-size: 0.95rem; color: var(--muted); }
  .back:hover { color: var(--accent); }
  .title { font-family: var(--serif); font-size: 2.1rem; font-weight: 600; letter-spacing: -0.015em; line-height: 1.25; margin-bottom: 8px; }
  .desc { font-size: 1.1rem; color: var(--muted); margin-bottom: 24px; }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 10px 22px; align-items: baseline; padding: 18px 22px; margin-bottom: 24px; }
  .meta-value { font: 0.9rem var(--mono); word-break: break-all; }
  .path { display: flex; gap: 10px; align-items: baseline; }
  .btn { flex: none; padding: 4px 12px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font: 0.85rem var(--sans); cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }

  .issues { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .issues li { padding: 10px 16px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 0.95rem; }
  .issues b { font-family: var(--mono); font-size: 0.85rem; margin-right: 8px; }
  .audit .issues { margin: 16px 0 0; }

  .md { padding: 26px 30px; font-size: 1.02rem; overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 12px 0; }
  .md h1, .md h2, .md h3, .md h4 { font-family: var(--serif); font-weight: 600; line-height: 1.3; margin: 22px 0 10px; }
  .md h1 { font-size: 1.5rem; } .md h2 { font-size: 1.3rem; } .md h3 { font-size: 1.12rem; }
  .md ul, .md ol { margin: 12px 0; padding-left: 1.5em; }
  .md li { margin: 4px 0; }
  .md a { text-decoration: underline; }
  .md strong { font-weight: 650; }
  .md code { font-family: var(--mono); font-size: 0.88em; background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; }
  .md pre { background: var(--code-bg); border-radius: 10px; padding: 14px 16px; margin: 14px 0; overflow-x: auto; }
  .md pre code { background: none; border: none; padding: 0; color: var(--code-ink); font-size: 0.88rem; }
  .md blockquote { border-left: 3px solid var(--border-strong); padding-left: 14px; color: var(--muted); }

  .audit-page .title { margin-bottom: 4px; }
  .audit-status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 20px; font-size: 0.95rem; color: var(--muted); }
  .badge.status { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .badge.status.done { background: var(--surface-2); color: var(--muted); }
  .attach { display: inline-flex; align-items: center; gap: 8px; }
  .attach code, .files code { font: 0.85rem var(--mono); }
  .message { padding: 20px 24px; margin-bottom: 24px; }
  .section-label { display: block; margin: 28px 0 12px; }
  .sg { padding: 18px 22px; margin-bottom: 14px; }
  .sg.closed { opacity: 0.65; }
  .sg-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
  .sg-id { font: 0.8rem var(--mono); color: var(--faint); }
  .badge.action { background: var(--accent-soft); border-color: transparent; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; }
  .badge.action.delete { background: var(--warn-soft); color: var(--warn); }
  .badge.action.keep { background: var(--surface-2); border-color: var(--border); color: var(--muted); }
  .files { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; overflow-wrap: anywhere; }
  .files a { font: 0.85rem var(--mono); }
  .sg .md, .message.md { padding: 0; font-size: 0.98rem; }
  .message.md { padding: 20px 24px; }
  .proposed { margin-top: 12px; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 8px; }
  .proposed .label { display: block; margin-bottom: 4px; }
  .choices { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
  .choice.active.accept { background: var(--accent); border-color: var(--accent); color: #fff; }
  .choice.active.reject { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .choices input { flex: 1; min-width: 180px; padding: 6px 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font: 0.9rem var(--sans); }
  textarea { width: 100%; min-height: 90px; padding: 10px 14px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface); color: var(--ink); font: 0.95rem/1.6 var(--sans); resize: vertical; }
  textarea:focus, .choices input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }
  .send { display: flex; align-items: center; gap: 12px; margin-top: 10px; font-size: 0.9rem; color: var(--muted); }
  .replies { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .replies li { padding: 10px 16px; font-size: 0.92rem; color: var(--muted); }
  .replies time { font-size: 0.82rem; color: var(--faint); margin-right: 8px; }
  .callout { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; padding: 12px 16px; margin-bottom: 24px; border-radius: 10px; background: var(--accent-soft); font-size: 0.95rem; }
  .callout .md { padding: 0; font-size: 0.95rem; }
  .callout .md p { margin: 0; }

  @media (max-width: 800px) {
    body { height: auto; display: block; }
    header { padding: 14px 16px; }
    header .sub { display: none; }
    #launchBar { padding: 10px 16px; }
    .panes { display: flex; flex-direction: column; }
    #listPane { padding: 20px 16px 40px; border-right: 0; }
    #detailPane { order: -1; padding: 20px 16px 0; }
    .selected-memory #listPane { display: none; }
    .selected-memory #detailPane { padding-bottom: 60px; }
    .selected-memory .back { display: inline-block; }
    .md { padding: 20px; }
    .title { font-size: 1.7rem; }
  }
</style>
</head>
<body>
<header>
  <span class="mark" aria-hidden="true"></span>
  <h1><a href="#">cc-memory-view</a></h1>
  <span class="sub">Claude Code Memory</span>
  <button class="btn primary" id="auditButton" title="Starts claude --bg in the workspace prepared by cc-memory-view setup">Audit with Claude Code</button>
</header>
<div id="launchBar" hidden></div>
<div class="panes">
  <div id="listPane">
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search memory">
      <select id="project"><option value="">All projects</option></select>
      <select id="type"><option value="">All types</option></select>
      <label class="check"><input type="checkbox" id="issuesOnly"> With issues</label>
      <span class="count" id="count"></span>
    </div>
    <div class="card list" id="list"></div>
  </div>
  <div id="detailPane"></div>
</div>
<script>
let data = { memories: [], issues: [] };
const $ = (id) => document.getElementById(id);

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  Object.assign(e, attrs);
  e.append(...children);
  return e;
}

const badge = (cls, text) => el("span", { className: "badge " + cls, textContent: text });
const date = (s) => new Date(s).toLocaleDateString();

function issueList(issues, withProject) {
  return el("ul", { className: "issues" }, ...issues.map((i) =>
    el("li", {}, el("b", { textContent: i.kind }), withProject ? `${i.project} — ${i.detail}` : i.detail)));
}

function auditCard() {
  const files = new Set(data.memories.map((m) => m.file));
  const projectIssues = data.issues.filter((i) => !files.has(i.file));
  const counts = {};
  for (const i of data.issues) counts[i.kind] = (counts[i.kind] || 0) + 1;
  const stat = (n, label, warn) => el("div", { className: "stat" },
    el("span", { className: "stat-num" + (warn && n ? " warn" : ""), textContent: n }),
    el("span", { className: "label", textContent: label }));
  const note = el("span", { className: "audit-note" }, "Rule-based candidates. Claude Code decides with you what to keep, merge or delete.");
  return el("section", { className: "card audit" },
    el("div", { className: "audit-head" }, el("span", { className: "label", textContent: "Audit" }), note),
    el("div", { className: "stats" },
      stat(new Set(data.memories.map((m) => m.project)).size, "Projects"),
      stat(data.memories.length, "Memories"),
      stat(data.issues.length, "Issues", true)),
    ...(Object.keys(counts).length ? [el("div", { className: "kinds" }, ...Object.entries(counts).map(([k, n]) => badge("issue", `${k} ${n}`)))] : []),
    ...(projectIssues.length ? [issueList(projectIssues, true)] : []));
}

let launch = null;
let latest = null;
let auditData = null;
let auditJSON = "";
const draft = { token: null, decisions: {}, message: "" };

function renderLaunch() {
  const active = latest && latest.status !== "done";
  $("auditButton").textContent = active ? "Open audit" : "Audit with Claude Code";
  $("auditButton").disabled = !!launch?.pending;
  $("launchBar").hidden = !launch;
  if (!launch) return;
  const result = el("div", { className: "launch-result" + (launch.error ? " error" : ""),
    textContent: launch.pending ? "Starting a background session…" : launch.error });
  const dismiss = el("button", { className: "dismiss", textContent: "×", title: "Dismiss", hidden: launch.pending });
  dismiss.onclick = () => { launch = null; renderLaunch(); };
  $("launchBar").replaceChildren(result, dismiss);
}

async function onAuditButton() {
  if (latest && latest.status !== "done") {
    location.hash = "audit";
    return;
  }
  await startAudit();
}

async function startAudit() {
  launch = { pending: true };
  renderLaunch();
  try {
    const res = await fetch("api/audits", { method: "POST" });
    const text = await res.text();
    launch = res.ok ? null : { error: text.trim() };
    if (res.ok) {
      await poll();
      location.hash = "audit";
    }
  } catch (e) {
    launch = { error: String(e) };
  }
  renderLaunch();
}

// poll refreshes the latest audit, and the memory list after Claude changed
// something.
async function poll() {
  try {
    const list = await (await fetch("api/audits")).json();
    latest = list[0] || null;
    renderLaunch();
    if (!latest) return;
    const res = await fetch("api/audits/" + latest.session.token);
    const text = await res.text();
    if (!res.ok || text === auditJSON) return;
    const prev = auditData;
    auditJSON = text;
    auditData = JSON.parse(text);
    if (draft.token !== auditData.session.token) Object.assign(draft, { token: auditData.session.token, decisions: {}, message: "" });
    if (prev && prev.updated !== auditData.updated) await loadData();
    else if (current() === "audit" || memoryOfSuggestion()) route(false);
  } catch {
    // Keep showing the last known state; the next poll retries.
  }
}

const memoryOfSuggestion = () => auditData?.suggestions.some((sg) => sg.memoryIDs.includes(current()));

const statusText = {
  starting: "Claude is starting and reading your memory…",
  working: "Claude is working…",
  waiting: "Waiting for your reply.",
  done: "Finished.",
};

function memoryLink(file, id) {
  const m = data.memories.find((m) => m.id === id);
  return m ? el("a", { href: "#" + id, textContent: `${m.name} · ${m.project}`, title: file }) : el("code", { textContent: file });
}

function html(cls, markup) {
  const e = el("div", { className: cls });
  e.innerHTML = markup;
  return e;
}

function suggestionCard(sg, canReply) {
  const d = draft.decisions[sg.id] || {};
  const setDecision = (decision) => {
    draft.decisions[sg.id] = { ...d, decision: d.decision === decision ? "" : decision };
    renderAudit();
  };
  const choice = (decision, label) => {
    const b = el("button", { className: `btn choice ${decision}` + (d.decision === decision ? " active" : ""), textContent: label });
    b.onclick = () => setDecision(decision);
    return b;
  };
  const comment = el("input", { type: "text", placeholder: "Comment (optional)", value: d.comment || "" });
  comment.dataset.key = "comment-" + sg.id;
  comment.oninput = () => { draft.decisions[sg.id] = { ...draft.decisions[sg.id], comment: comment.value }; };
  return el("section", { className: "card sg" + (sg.open ? "" : " closed") },
    el("div", { className: "sg-head" },
      badge("action " + sg.action, sg.action),
      ...(sg.open ? [] : [badge("status done", sg.status)]),
      el("span", { className: "sg-id", textContent: sg.id })),
    ...(sg.files.length ? [el("div", { className: "files" }, ...sg.files.map((f, i) => memoryLink(f, sg.memoryIDs[i])))] : []),
    html("md", sg.reasonHTML),
    ...(sg.proposedHTML ? [el("div", { className: "proposed" }, el("span", { className: "label", textContent: "Proposed" }), html("md", sg.proposedHTML))] : []),
    ...(sg.open && canReply ? [el("div", { className: "choices" }, choice("accept", "Accept"), choice("reject", "Reject"), comment)] : []));
}

function renderAudit() {
  const a = auditData;
  if (!a) {
    $("detailPane").replaceChildren(el("p", { className: "empty", textContent: "No audit yet. Start one with the button above." }));
    return;
  }
  const focused = document.activeElement?.dataset?.key;
  const selection = focused && [document.activeElement.selectionStart, document.activeElement.selectionEnd];

  const lastReply = a.replies[a.replies.length - 1];
  const replyPending = a.status === "waiting" && lastReply && new Date(lastReply.time) > new Date(a.updated);
  const canReply = a.status === "waiting" && !replyPending;
  const attach = `claude attach ${a.session.id}`;
  const restart = el("button", { className: "btn", textContent: "Start a new audit",
    title: "Leaves this session as it is; stop it with claude stop if it's stuck" });
  restart.onclick = startAudit;

  const message = el("textarea", { placeholder: "Message to Claude (optional)", value: draft.message, disabled: !canReply });
  message.dataset.key = "message";
  const send = el("button", { className: "btn primary", textContent: "Send reply", disabled: !canReply });
  const sendNote = el("span");
  message.oninput = () => { draft.message = message.value; };
  send.onclick = async () => {
    const decisions = Object.entries(draft.decisions)
      .filter(([, d]) => d.decision || d.comment)
      .map(([id, d]) => ({ id, decision: d.decision || "", comment: d.comment || "" }));
    send.disabled = true;
    const res = await fetch(`api/audits/${a.session.token}/reply`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: draft.message, decisions }),
    });
    if (!res.ok) {
      sendNote.textContent = (await res.text()).trim();
      send.disabled = false;
      return;
    }
    Object.assign(draft, { decisions: {}, message: "" });
    await poll();
  };

  const summary = (r) => {
    const n = (d) => r.decisions?.filter((x) => x.decision === d).length || 0;
    const parts = [];
    if (n("accept")) parts.push(`accepted ${n("accept")}`);
    if (n("reject")) parts.push(`rejected ${n("reject")}`);
    if (r.message) parts.push(`“${r.message}”`);
    return parts.join(", ") || "comments";
  };

  $("detailPane").replaceChildren(el("div", { className: "audit-page" },
    el("a", { className: "back", href: "#", textContent: "← All memories" }),
    el("h2", { className: "title", textContent: "Audit with Claude Code" }),
    el("div", { className: "audit-status" },
      badge("status" + (a.status === "done" ? " done" : ""), a.status),
      replyPending ? "Reply sent. Waiting for Claude to pick it up…" : statusText[a.status] || "",
      el("span", { className: "attach" }, el("code", { textContent: attach }), copyButton(attach)),
      restart),
    ...(a.messageHTML ? [html("card message md", a.messageHTML)] : []),
    ...(a.suggestions.length ? [el("span", { className: "label section-label", textContent: `Suggestions (${a.suggestions.filter((s) => s.open).length} open)` }),
      ...a.suggestions.map((sg) => suggestionCard(sg, canReply))] : []),
    ...(a.status !== "done" ? [el("span", { className: "label section-label", textContent: "Reply" }), message,
      el("div", { className: "send" }, send, sendNote)] : []),
    ...(a.replies.length ? [el("span", { className: "label section-label", textContent: "Your replies" }),
      el("ul", { className: "replies" }, ...a.replies.map((r) =>
        el("li", { className: "card" }, el("time", { textContent: new Date(r.time).toLocaleString() }), summary(r))))] : [])));

  if (focused) {
    const e = document.querySelector(`[data-key="${focused}"]`);
    if (e) {
      e.focus();
      e.setSelectionRange?.(...selection);
    }
  }
}

function renderList() {
  const q = $("q").value.toLowerCase();
  const ms = data.memories.filter((m) =>
    (!$("project").value || m.project === $("project").value) &&
    (!$("type").value || m.type === $("type").value) &&
    (!$("issuesOnly").checked || m.issues?.length) &&
    (!q || [m.name, m.description, m.body, m.project].join("\n").toLowerCase().includes(q)));
  $("count").textContent = `${ms.length} of ${data.memories.length}`;
  if (!ms.length) {
    $("list").replaceChildren(el("div", { className: "empty", textContent: "No memories match." }));
    return;
  }
  const id = current();
  $("list").replaceChildren(...ms.map((m) => el("a", { className: "row" + (m.id === id ? " selected" : ""), href: "#" + m.id },
    el("span", { className: "row-name", textContent: m.name }),
    el("span", { className: "ts", textContent: date(m.modified) }),
    el("span", { className: "row-desc", textContent: m.description }),
    el("span", { className: "row-meta" },
      badge("type", m.type || "?"),
      m.project,
      ...(m.issues || []).map((i) => badge("issue", i.kind))))));
}

function copyButton(text) {
  const b = el("button", { className: "btn", textContent: "Copy" });
  b.onclick = async () => { await navigator.clipboard.writeText(text); b.textContent = "Copied"; };
  return b;
}

function renderDetail(m) {
  const row = (label, ...value) => [el("span", { className: "label", textContent: label }), el("span", { className: "meta-value" }, ...value)];
  const body = el("div", { className: "card md" });
  body.innerHTML = m.html;
  $("detailPane").replaceChildren(
    el("a", { className: "back", href: "#", textContent: "← All memories" }),
    el("h2", { className: "title", textContent: m.name }),
    el("p", { className: "desc", textContent: m.description }),
    el("div", { className: "card meta" },
      ...row("Type", badge("type", m.type || "?")),
      ...row("Project", m.project),
      ...row("Modified", new Date(m.modified).toLocaleString()),
      ...row("File", el("span", { className: "path" }, el("span", { textContent: m.file }), copyButton(m.file)))),
    ...(m.issues?.length ? [issueList(m.issues, false)] : []),
    ...(auditData?.suggestions.filter((sg) => sg.open && sg.memoryIDs.includes(m.id)).map((sg) =>
      el("div", { className: "callout" }, el("span", { className: "label", textContent: "Claude suggests" }), badge("action " + sg.action, sg.action),
        html("md", sg.reasonHTML), el("a", { href: "#audit", textContent: "Open audit →" }))) || []),
    body);
}

const current = () => decodeURIComponent(location.hash.slice(1));

function route(scroll = true) {
  const id = current();
  const m = data.memories.find((m) => m.id === id);
  document.body.classList.toggle("selected-memory", !!m || id === "audit");
  if (m) renderDetail(m);
  else if (id === "audit") renderAudit();
  else $("detailPane").replaceChildren(auditCard());
  renderList();
  if (!scroll) return;
  $("detailPane").scrollTop = 0;
  if ((m || id === "audit") && matchMedia("(max-width: 800px)").matches) window.scrollTo(0, 0);
}

function fillSelect(select, values) {
  const value = select.value;
  select.replaceChildren(select.options[0], ...[...new Set(values)].sort().map((v) => el("option", { value: v, textContent: v })));
  select.value = value;
}

async function loadData() {
  const res = await fetch("api/data");
  if (!res.ok) {
    $("list").replaceChildren(el("div", { className: "empty", textContent: await res.text() }));
    return;
  }
  data = await res.json();
  fillSelect($("project"), data.memories.map((m) => m.project));
  fillSelect($("type"), data.memories.map((m) => m.type).filter(Boolean));
  route(false);
}

async function load() {
  await loadData();
  await poll();
  route();
  setInterval(poll, 3000);
}

for (const id of ["q", "project", "type", "issuesOnly"]) $(id).addEventListener("input", renderList);
window.addEventListener("hashchange", route);
$("auditButton").onclick = onAuditButton;
load();
</script>
</body>
</html>

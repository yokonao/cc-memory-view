<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc-memory-view</title>
<style>
  :root {
    --bg: #fff; --fg: #1f2328; --muted: #656d76; --border: #d0d7de;
    --panel: #f6f8fa; --accent: #0969da; --warn: #9a6700; --warn-bg: #fff8c5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --border: #30363d;
      --panel: #161b22; --accent: #4493f8; --warn: #d29922; --warn-bg: #3b2e0a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  input, select { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
  input[type=search] { flex: 1; min-width: 160px; }
  main { display: grid; grid-template-columns: minmax(280px, 2fr) 3fr; height: calc(100vh - 57px); }
  #list { overflow: auto; border-right: 1px solid var(--border); }
  #detail { overflow: auto; padding: 16px 24px; }
  .item { display: block; padding: 8px 16px; border-bottom: 1px solid var(--border); color: inherit; text-decoration: none; }
  .item:hover, .item.selected { background: var(--panel); }
  .item .name { font-weight: 600; }
  .meta, .desc { color: var(--muted); font-size: 12px; }
  .tag { display: inline-block; padding: 0 6px; border: 1px solid var(--border); border-radius: 10px; font-size: 11px; margin-right: 4px; }
  .tag.issue { color: var(--warn); background: var(--warn-bg); border-color: var(--warn); }
  .issues { list-style: none; padding: 0; }
  .issues li { color: var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 4px 8px; margin: 4px 0; }
  .path { display: flex; gap: 8px; align-items: center; font: 12px ui-monospace, monospace; color: var(--muted); word-break: break-all; }
  button { flex: none; white-space: nowrap; font: inherit; font-size: 12px; color: inherit; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .body { border-top: 1px solid var(--border); margin-top: 16px; }
  .body a, #detail a { color: var(--accent); }
  pre, code { font-family: ui-monospace, monospace; background: var(--panel); border-radius: 4px; }
  code { padding: 0 4px; }
  pre { padding: 8px; overflow: auto; }
  pre code { padding: 0; }
  h2 { margin: 0 0 4px; }
  h3 { font-size: 14px; }
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; height: auto; }
    #list { max-height: 50vh; border-right: 0; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header>
  <h1>cc-memory-view</h1>
  <input type="search" id="q" placeholder="Search">
  <select id="project"><option value="">All projects</option></select>
  <select id="type"><option value="">All types</option></select>
  <label><input type="checkbox" id="issuesOnly"> With issues</label>
  <span class="meta" id="count"></span>
</header>
<main>
  <div id="list"></div>
  <div id="detail"></div>
</main>
<script>
let data = { memories: [], issues: [] };
const $ = (id) => document.getElementById(id);

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  Object.assign(e, attrs);
  e.append(...children);
  return e;
}

function fillSelect(select, values) {
  for (const v of [...new Set(values)].sort()) select.append(el("option", { value: v, textContent: v }));
}

function filtered() {
  const q = $("q").value.toLowerCase();
  return data.memories.filter((m) =>
    (!$("project").value || m.project === $("project").value) &&
    (!$("type").value || m.type === $("type").value) &&
    (!$("issuesOnly").checked || m.issues?.length) &&
    (!q || [m.name, m.description, m.body, m.project].join("\n").toLowerCase().includes(q)));
}

function renderList() {
  const ms = filtered();
  $("count").textContent = `${ms.length} / ${data.memories.length}`;
  $("list").replaceChildren(...ms.map((m) => el("a", { className: "item" + (m.id === current() ? " selected" : ""), href: "#" + m.id },
    el("div", { className: "name", textContent: m.name }),
    el("div", { className: "desc", textContent: m.description }),
    el("div", { className: "meta" },
      el("span", { className: "tag", textContent: m.type || "?" }),
      ...(m.issues || []).map((i) => el("span", { className: "tag issue", textContent: i.kind })),
      m.project))));
}

function issueList(issues) {
  return el("ul", { className: "issues" }, ...issues.map((i) => el("li", { textContent: `${i.kind}: ${i.detail}` })));
}

function copyButton(text) {
  const b = el("button", { textContent: "Copy" });
  b.onclick = async () => { await navigator.clipboard.writeText(text); b.textContent = "Copied"; };
  return b;
}

function renderOverview() {
  const files = new Set(data.memories.map((m) => m.file));
  const projectIssues = data.issues.filter((i) => !files.has(i.file));
  const counts = {};
  for (const i of data.issues) counts[i.kind] = (counts[i.kind] || 0) + 1;
  $("detail").replaceChildren(
    el("h2", { textContent: "Audit" }),
    el("p", { className: "meta", textContent: `${data.memories.length} memories, ${data.issues.length} issues. Run "cc-memory-view check" to hand these to Claude Code.` }),
    el("p", {}, ...Object.entries(counts).map(([k, n]) => el("span", { className: "tag issue", textContent: `${k} ${n}` }))),
    ...(projectIssues.length ? [el("h3", { textContent: "Project issues" }),
      el("ul", { className: "issues" }, ...projectIssues.map((i) => el("li", {}, `${i.kind}: ${i.project} — ${i.detail}`)))] : []));
}

function renderDetail() {
  const m = data.memories.find((m) => m.id === current());
  if (!m) return renderOverview();
  const body = el("div", { className: "body" });
  body.innerHTML = m.html;
  $("detail").replaceChildren(
    el("h2", { textContent: m.name }),
    el("div", { className: "meta" },
      el("span", { className: "tag", textContent: m.type || "?" }),
      `${m.project} · modified ${new Date(m.modified).toLocaleString()}`),
    el("div", { className: "path" }, m.file, copyButton(m.file)),
    el("p", { textContent: m.description }),
    ...(m.issues?.length ? [issueList(m.issues)] : []),
    body);
  $("detail").scrollTop = 0;
}

const current = () => decodeURIComponent(location.hash.slice(1));
const render = () => { renderList(); renderDetail(); };

async function load() {
  const res = await fetch("api/data");
  if (!res.ok) {
    $("detail").textContent = await res.text();
    return;
  }
  data = await res.json();
  fillSelect($("project"), data.memories.map((m) => m.project));
  fillSelect($("type"), data.memories.map((m) => m.type).filter(Boolean));
  render();
}

for (const id of ["q", "project", "type", "issuesOnly"]) $(id).addEventListener("input", renderList);
window.addEventListener("hashchange", render);
load();
</script>
</body>
</html>
